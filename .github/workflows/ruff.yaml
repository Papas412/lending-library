name: Ruff Linting

on:
  push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install ruff
      - name: Run Ruff
        run: ruff check .
      - name: Run Ruff Format
        run: ruff format .